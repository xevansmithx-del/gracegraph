[build-system]
requires = ["setuptools>=83,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "gracegraph"
version = "0.1.0a2"
description = "Fail-closed evidence graph compiler for bounded scientific claims"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Evan Smith"}]
keywords = [
  "evidence-graph",
  "provenance",
  "reproducibility",
  "research-software",
  "scientific-computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "setuptools>=83,<85",
  "twine>=5,<7",
  "wheel>=0.45,<1",
]

[project.scripts]
gracegraph = "gracegraph.cli:main"

[project.urls]
Homepage = "https://github.com/xevansmithx-del/gracegraph"
Repository = "https://github.com/xevansmithx-del/gracegraph"
Issues = "https://github.com/xevansmithx-del/gracegraph/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
