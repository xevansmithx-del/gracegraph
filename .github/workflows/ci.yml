name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Test
        run: uv run --frozen --no-sync pytest --cov=gracegraph --cov-report=term-missing
      - name: Compile source and tests
        run: uv run --frozen --no-sync python -m compileall -q src tests examples

  quality:
    name: Release and trust-boundary checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Lint, format, hooks, and privacy
        run: |
          uv run --frozen --no-sync ruff check .
          uv run --frozen --no-sync ruff format --check .
          uv run --frozen --no-sync pre-commit run --all-files
          uv run --frozen --no-sync python scripts/privacy_scan.py .
      - name: Replay optimized-runtime boundary
        run: |
          normal=$(uv run --frozen --no-sync python tests/optimized_runtime_probe.py)
          optimized=$(uv run --frozen --no-sync python -O tests/optimized_runtime_probe.py)
          test "$normal" = "$optimized"
      - name: Replay synthetic example
        run: |
          uv run --frozen --no-sync gracegraph compile examples/public-demo.json \
            --project-root . --out "$RUNNER_TEMP/gracegraph-capsule"
          uv run --frozen --no-sync gracegraph verify "$RUNNER_TEMP/gracegraph-capsule" \
            --project-root .
      - name: Build and check packages
        run: |
          uv run --frozen --no-sync python -m build
          uv run --frozen --no-sync python -m twine check dist/*
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          mkdir -p "$RUNNER_TEMP/wheel-tree" "$RUNNER_TEMP/sdist-tree"
          uv run --frozen --no-sync python -m zipfile -e "$wheel" "$RUNNER_TEMP/wheel-tree"
          uv run --frozen --no-sync python -m tarfile -e "$sdist" "$RUNNER_TEMP/sdist-tree"
          uv run --frozen --no-sync python scripts/privacy_scan.py "$RUNNER_TEMP/wheel-tree"
          uv run --frozen --no-sync python scripts/privacy_scan.py "$RUNNER_TEMP/sdist-tree"
      - name: Installed-wheel smoke
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/gracegraph" --version

  source-manifest:
    name: Exact source freeze
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source manifest
        run: sha256sum --check SOURCE_SHA256SUMS.txt
